name: Build and deploy

# Rebuilds stars.json from the public starred list every day, tests it (including the parity test
# with the repo-fit-check skill) and publishes site/ to GitHub Pages. Deploy runs only if every test passes.
#
# Setup, once: repository Settings > Pages > Source: GitHub Actions.
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   STAR_USER  the GitHub account whose public stars are published. Default: the repository owner.
#              For an organisation repository set it, or the site would list the organisation's stars.
#   MIN_COUNT  fail instead of publishing fewer repositories than this. Default 1 (an empty reply).
#
# SKILL_REF pins the repo-fit-check commit that the parity test compares with. Change it together with
# the site whenever the skill's ranking rules or glossary change. A moving branch would make the daily
# data refresh fail the moment the skill changes first, and it would run someone else's code in this job.
#
# GitHub switches scheduled workflows off after 60 days without repository activity. If the
# site shows "갱신이 N일 전에 멈춰 있습니다", run this workflow once by hand (Actions > Run workflow).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SKILL_REF: c0e3c471fdbe85ed7a028759dba6bc2eea24f774

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAR_USER: ${{ vars.STAR_USER || github.repository_owner }}
      MIN_COUNT: ${{ vars.MIN_COUNT || '1' }}
      REPO_FIT_CHECK_DIR: ${{ github.workspace }}/repo-fit-check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the skill at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: junthropic/Repo-Fit-Check
          ref: ${{ env.SKILL_REF }}
          path: repo-fit-check
          persist-credentials: false

      - name: Build the snapshot (private repositories are left out; only their count is logged)
        run: python3 scripts/build_snapshot.py --user "$STAR_USER" --min-count "$MIN_COUNT"

      - name: JavaScript tests
        run: node --test tests/search.test.js tests/app.test.js

      - name: Python tests (snapshot, site structure, parity with the skill)
        run: python3 -m unittest discover -s tests

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Separate job: only this one holds the permissions to change the published site.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
