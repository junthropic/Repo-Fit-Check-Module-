<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타 검색</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="스타해 둔 GitHub 저장소 안에서 문장으로 찾는 검색">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<main id="app" class="home">
  <header>
    <h1><a href="./" id="home-link">스타 검색</a></h1>
  </header>

  <form id="search-form" role="search" autocomplete="off">
    <label class="sr-only" for="q">찾는 저장소</label>
    <input id="q" name="q" type="search" maxlength="200" placeholder="찾는 저장소를 문장으로 적어 보세요" autofocus>
    <button type="submit">검색</button>
  </form>

  <p id="examples" class="examples">
    예:
    <button type="button" class="link" data-q="한국 노동법 준수를 점검하는 도구 찾고 있어">한국 노동법 준수를 점검하는 도구 찾고 있어</button>
    <button type="button" class="link" data-q="pdf translation">pdf translation</button>
  </p>

  <p id="status" class="sr-only" role="status"></p>
  <section id="results" hidden>
    <p id="notice-interpret" class="note"></p>
    <p id="notes" class="note notes" hidden></p>
    <div id="terms-box">
      <span class="label">검색어 해석</span>
      <ul id="chips" class="chips"></ul>
      <form id="add-form" class="add-form" autocomplete="off">
        <label class="sr-only" for="add-input">검색어 추가</label>
        <input id="add-input" type="text" placeholder="영어 단어 추가 (동의어는 | 로)" maxlength="60">
        <button type="submit">추가</button>
      </form>
    </div>
    <label class="toggle"><input id="permissive" type="checkbox"> 허용형 라이선스만 보기</label>
    <p id="summary" class="summary"></p>
    <p id="message" class="message" hidden></p>
    <ol id="list" class="list"></ol>
    <button id="more" class="more" type="button" hidden>더 보기</button>
    <section id="small-box" hidden>
      <h2>스타 500개 미만이면서 관련도가 높은 저장소</h2>
      <ol id="small-list" class="list"></ol>
    </section>
  </section>

  <p id="error" class="message" role="alert" hidden></p>
</main>

<footer>
  <p id="notice">후보 목록이며 적합성 판정이 아닙니다.</p>
  <p id="meta" class="meta"></p>
</footer>

<noscript><p class="message">이 페이지는 JavaScript가 필요합니다.</p></noscript>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
